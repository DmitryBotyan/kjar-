name: Деплой KJÁR

# Раннер GitHub ходит на сервер напрямую, поэтому ограничения сети разработчика
# на выкладку не влияют.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Сборка и запуск на сервере
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      REMOTE_DIR: /opt/kjar
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Проверить, что секреты заданы
        run: |
          missing=""
          [ -n "${{ secrets.SSH_HOST }}" ] || missing="$missing SSH_HOST"
          [ -n "${{ secrets.SSH_USER }}" ] || missing="$missing SSH_USER"
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "${{ secrets.ENV_PRODUCTION }}" ] || missing="$missing ENV_PRODUCTION"
          if [ -n "$missing" ]; then echo "Не заданы секреты:$missing"; exit 1; fi

      # Вся выкладка одним скриптом: весь вывод копится в один лог,
      # который затем возвращается в репозиторий и доступен для разбора
      - name: Выкатить
        id: deploy
        continue-on-error: true
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          exec > >(tee -a /tmp/deploy.log) 2>&1
          set -x
          COMPOSE="docker compose --env-file .env.production -f docker/docker-compose.prod.yml"

          echo "=== 0. ключ ==="
          mkdir -p ~/.ssh
          # Ключ часто вставляют с отступами или CRLF, из-за чего libcrypto
          # отказывается его читать. Нормализуем перед записью.
          printf '%s\n' "$KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "размер ключа: $(wc -c < ~/.ssh/id_ed25519) байт, строк: $(wc -l < ~/.ssh/id_ed25519)"
          echo "первая строка: $(head -1 ~/.ssh/id_ed25519)"
          echo "последняя строка: $(tail -1 ~/.ssh/id_ed25519)"
          ssh-keygen -y -f ~/.ssh/id_ed25519 || echo "КЛЮЧ НЕ ЧИТАЕТСЯ"
          {
            echo "Host target"
            echo "  HostName ${SSH_HOST}"
            echo "  User ${SSH_USER}"
            echo "  Port ${SSH_PORT:-22}"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  ConnectTimeout 20"
            echo "  BatchMode yes"
            echo "  ServerAliveInterval 20"
            echo "  ServerAliveCountMax 30"
            echo "  ControlMaster auto"
            echo "  ControlPath ~/.ssh/cm-%r@%h:%p"
            echo "  ControlPersist 20m"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          echo "=== 1. состояние сервера ==="
          ssh target 'whoami; uname -a; command -v docker || echo "docker НЕТ"; command -v tar; df -h / | tail -1; free -m | head -2'

          echo "=== 2. каталог ==="
          ssh target "mkdir -p ${REMOTE_DIR} && ls -la ${REMOTE_DIR} | head -5"

          echo "=== 3. перенос кода ==="
          tar czf /tmp/kjar.tgz \
            --exclude='./node_modules' --exclude='*/node_modules' \
            --exclude='./.next' --exclude='*/.next' \
            --exclude='./.git' --exclude='*.tsbuildinfo' \
            --exclude='./.env' --exclude='./.env.production' .
          ls -lh /tmp/kjar.tgz
          ssh target "cat > /tmp/kjar.tgz" < /tmp/kjar.tgz
          ssh target "tar xzf /tmp/kjar.tgz -C ${REMOTE_DIR} && rm -f /tmp/kjar.tgz && find ${REMOTE_DIR} -type f | wc -l"

          echo "=== 4. боевые переменные ==="
          printf '%s\n' "$ENV_PRODUCTION" | ssh target "umask 077 && cat > ${REMOTE_DIR}/.env.production"
          ssh target "grep -c = ${REMOTE_DIR}/.env.production"

          echo "=== 5. сборка образов ==="
          ssh target "cd ${REMOTE_DIR} && rm -f build.done && setsid nohup bash -c '${COMPOSE} build > build.log 2>&1; echo \$? > build.done' > /dev/null 2>&1 < /dev/null &" || true
          for i in $(seq 1 120); do
            if ssh target "test -f ${REMOTE_DIR}/build.done" 2>/dev/null; then break; fi
            sleep 15
          done
          ssh target "tail -30 ${REMOTE_DIR}/build.log" || true
          build_code=$(ssh target "cat ${REMOTE_DIR}/build.done 2>/dev/null || echo 1")
          echo "код сборки: $build_code"
          [ "$build_code" = "0" ]

          echo "=== 6. база и миграции ==="
          ssh target "cd ${REMOTE_DIR} && ${COMPOSE} up -d db"
          ssh target "cd ${REMOTE_DIR} && timeout 180 bash -c 'until ${COMPOSE} exec -T db pg_isready > /dev/null 2>&1; do sleep 3; done'"
          ssh target "cd ${REMOTE_DIR} && ${COMPOSE} --profile tools run --rm migrate"

          echo "=== 7. запуск ==="
          ssh target "cd ${REMOTE_DIR} && ${COMPOSE} up -d && ${COMPOSE} ps"

          echo "=== 8. проверка ==="
          ssh target "for i in \$(seq 1 24); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost/ || true)
              echo \"попытка \$i: \$code\"
              [ \"\$code\" = '200' ] && exit 0
              sleep 5
            done
            cd ${REMOTE_DIR} && ${COMPOSE} logs --tail=60 web api nginx
            exit 1"

      # Лог возвращается в репозиторий: иначе разбор ошибок идёт вслепую
      - name: Сохранить лог деплоя
        if: always()
        run: |
          mkdir -p .deploy-logs
          cp /tmp/deploy.log .deploy-logs/last-deploy.log 2>/dev/null || echo "лог не создан" > .deploy-logs/last-deploy.log
          echo "результат выкладки: ${{ steps.deploy.outcome }}" >> .deploy-logs/last-deploy.log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f .deploy-logs/last-deploy.log
          git commit -m "Лог последнего деплоя [skip ci]" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: Отразить результат
        if: always()
        run: |
          [ "${{ steps.deploy.outcome }}" = "success" ] || exit 1
