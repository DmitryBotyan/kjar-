name: Деплой KJÁR

# Раннер GitHub ходит на сервер напрямую, поэтому ограничения сети разработчика
# на выкладку не влияют.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Сборка и запуск на сервере
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      REMOTE_DIR: /opt/kjar
      COMPOSE: docker compose --env-file .env.production -f docker/docker-compose.prod.yml
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Проверить, что секреты заданы
        run: |
          missing=""
          [ -n "${{ secrets.SSH_HOST }}" ] || missing="$missing SSH_HOST"
          [ -n "${{ secrets.SSH_USER }}" ] || missing="$missing SSH_USER"
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "${{ secrets.ENV_PRODUCTION }}" ] || missing="$missing ENV_PRODUCTION"
          if [ -n "$missing" ]; then
            echo "Не заданы секреты:$missing"
            exit 1
          fi
          echo "секреты на месте"

      - name: Записать ключ
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Проверяем, что ключ читается, иначе дальше будет невнятная ошибка
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "ключ корректный"
          {
            echo "Host target"
            echo "  HostName ${SSH_HOST}"
            echo "  User ${SSH_USER}"
            echo "  Port ${SSH_PORT:-22}"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  ConnectTimeout 20"
            # Без этого ssh при отвергнутом ключе молча ждёт ввода пароля
            echo "  BatchMode yes"
            echo "  PasswordAuthentication no"
            echo "  PubkeyAuthentication yes"
            echo "  NumberOfPasswordPrompts 0"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Если ключа на сервере ещё нет, кладём его по паролю. Шаг идемпотентный
      # и нужен ровно один раз: дальше всё идёт по ключу.
      - name: Проверить, доходит ли сеть до сервера
        timeout-minutes: 2
        run: |
          echo "порт ${SSH_PORT:-22}:"
          nc -zv -w 10 "${SSH_HOST}" "${SSH_PORT:-22}" || echo "TCP не установился"
          echo "баннер SSH (ждём 10 секунд):"
          timeout 10 bash -c "cat < /dev/tcp/${SSH_HOST}/${SSH_PORT:-22}" | head -c 60 || echo "баннера нет"
          echo "порт 80:"
          nc -zv -w 10 "${SSH_HOST}" 80 || true

      - name: Положить ключ на сервер по паролю
        # Не критично: если ключ уже добавлен руками, деплой продолжится
        continue-on-error: true
        timeout-minutes: 3
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # Контекст secrets недоступен в условии if у шага, поэтому проверяем здесь
          if [ -z "${SSHPASS}" ]; then
            echo "секрет SSH_PASSWORD не задан, шаг пропущен"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PUB=$(ssh-keygen -y -f ~/.ssh/id_ed25519)
          printf '%s\n' "$PUB" > /tmp/deploy_key.pub
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            'mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && cat >> ~/.ssh/authorized_keys && sort -u -o ~/.ssh/authorized_keys ~/.ssh/authorized_keys && echo готово' < /tmp/deploy_key.pub

      - name: Проверить связь с сервером
        timeout-minutes: 3
        run: |
          # -v помогает понять, отвергнут ли ключ
          ssh -v target "echo подключение есть; docker --version || echo 'docker не установлен'; free -m | head -2" 2>&1 | tail -25

      # Идемпотентно: ставим то, чего не хватает. Полагаться на ручной bootstrap нельзя
      - name: Подготовить сервер
        timeout-minutes: 15
        run: |
          ssh target 'set -e
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v rsync > /dev/null; then
              apt-get update -qq && apt-get install -y -qq rsync
            fi
            if ! command -v docker > /dev/null; then
              curl -fsSL https://get.docker.com | sh
              systemctl enable --now docker
            fi
            if ! swapon --show | grep -q .; then
              fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
              grep -q "^/swapfile" /etc/fstab || echo "/swapfile none swap sw 0 0" >> /etc/fstab
              printf "vm.swappiness=10\nvm.vfs_cache_pressure=50\n" > /etc/sysctl.d/99-swap.conf
              sysctl --system > /dev/null
            fi
            mkdir -p /opt/kjar
            echo "rsync: $(rsync --version | head -1)"
            docker --version
            free -m | head -2'

      - name: Скопировать проект
        timeout-minutes: 10
        run: |
          ssh target "mkdir -p ${REMOTE_DIR}"
          rsync -az --delete \
            --exclude node_modules \
            --exclude .next \
            --exclude .git \
            --exclude .env \
            --exclude '*.tsbuildinfo' \
            ./ target:${REMOTE_DIR}/

      - name: Положить боевые переменные
        timeout-minutes: 3
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          printf '%s\n' "$ENV_PRODUCTION" | ssh target "umask 077 && cat > ${REMOTE_DIR}/.env.production"
          ssh target "grep -c '=' ${REMOTE_DIR}/.env.production | xargs -I{} echo 'переменных записано: {}'"

      - name: Собрать образы
        timeout-minutes: 25
        run: ssh target "cd ${REMOTE_DIR} && ${COMPOSE} build"

      - name: Поднять базу и применить миграции
        timeout-minutes: 10
        run: |
          ssh target "cd ${REMOTE_DIR} && ${COMPOSE} up -d db && \
            timeout 150 bash -c 'until ${COMPOSE} exec -T db pg_isready > /dev/null 2>&1; do sleep 3; done' && \
            ${COMPOSE} --profile tools run --rm migrate"

      - name: Запустить приложение
        timeout-minutes: 10
        run: ssh target "cd ${REMOTE_DIR} && ${COMPOSE} up -d && ${COMPOSE} ps"

      - name: Проверить, что сайт отвечает
        timeout-minutes: 5
        run: |
          ssh target "for i in \$(seq 1 24); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost/ || true)
              if [ \"\$code\" = '200' ]; then echo \"сайт отвечает: \$code\"; exit 0; fi
              sleep 5
            done
            echo 'сайт не ответил 200, логи ниже'
            cd ${REMOTE_DIR} && ${COMPOSE} logs --tail=50 web api nginx
            exit 1"

      - name: Убрать старые образы
        if: success()
        run: ssh target "docker image prune -f"
