name: Сборка образов KJÁR

# Собираем на раннере (с сервера реестр npm недоступен) и кладём образы
# в реестр GitHub. Сервер потом забирает их сам: входящий доступ не нужен.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images
  cancel-in-progress: true

jobs:
  build:
    name: Собрать и опубликовать образы
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Войти в реестр GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовить Buildx
        uses: docker/setup-buildx-action@v3

      - name: Собрать и опубликовать web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          target: web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kjar-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Собрать и опубликовать api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          target: api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kjar-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Итог
        run: |
          echo "Образы опубликованы:"
          echo "  ghcr.io/${{ github.repository_owner }}/kjar-web:latest"
          echo "  ghcr.io/${{ github.repository_owner }}/kjar-api:latest"
          echo "На сервере выполните: /opt/kjar/scripts/server-update.sh"
