# Боевое окружение. Исходники внутрь не монтируются, наружу торчит только nginx.
# Запуск: docker compose --env-file .env.production -f docker/docker-compose.prod.yml up -d
name: kjar-prod

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Наружу порт не публикуем: до базы ходят только контейнеры этой сети

  api:
    image: ${IMAGE_API:-ghcr.io/dmitrybotyan/kjar-api}:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${IMAGE_WEB:-ghcr.io/dmitrybotyan/kjar-web}:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      # Внутри сети web ходит в api по имени сервиса
      API_BASE_URL: http://api:3001/api/v1
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    depends_on:
      api:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Разовое создание бакета и публичного доступа на чтение
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set kjar http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing kjar/$${S3_BUCKET} &&
      mc anonymous set download kjar/$${S3_BUCKET}
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/kjar.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/conf.d/proxy_params.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - minio

  # Разовый выпуск и продление сертификата: docker compose ... run --rm certbot
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: ["certbot"]
    profiles: ["tools"]

  # Миграции: docker compose ... --profile tools run --rm migrate
  migrate:
    image: ${IMAGE_API:-ghcr.io/dmitrybotyan/kjar-api}:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
    working_dir: /app/packages/db
    entrypoint: ["node", "--import", "tsx", "src/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  db_data:
  minio_data:
  certbot_www:
  certbot_conf:
