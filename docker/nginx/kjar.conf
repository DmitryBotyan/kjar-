# Nginx перед Next. Весь трафик, включая /api, идёт в web:
# Next сам проксирует /api в Express, наружу Express не выставлен.

upstream kjar_web {
    server web:3000;
}

# HTTP: отдаём ACME-челлендж и работаем как есть, пока нет сертификата.
# После выпуска сертификата раскомментируйте редирект и блок 443.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Проверка домена для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # location / { return 301 https://$host$request_uri; }

    location / {
        proxy_pass http://kjar_web;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    client_max_body_size 12m;
}

