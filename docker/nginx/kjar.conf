# Nginx перед Next. Весь трафик, включая /api, идёт в web:
# Next сам проксирует /api в Express, наружу Express не выставлен.

upstream kjar_web {
    server web:3000;
}

# HTTP: только проверка домена для Let's Encrypt и перевод на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kjar.ru www.kjar.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kjar.ru$request_uri;
    }
}

# Обращения по IP отдаём как есть: удобно для проверки до настройки домена
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /s3/ {
        proxy_pass http://minio:9000/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location / {
        proxy_pass http://kjar_web;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    client_max_body_size 12m;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kjar.ru www.kjar.ru;

    ssl_certificate     /etc/letsencrypt/live/kjar.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kjar.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 12m;

    # www отправляем на основной домен
    if ($host = www.kjar.ru) {
        return 301 https://kjar.ru$request_uri;
    }

    # Картинки из объектного хранилища
    location /s3/ {
        proxy_pass http://minio:9000/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location / {
        proxy_pass http://kjar_web;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Имена файлов статики содержат хеш, поэтому кешируем надолго
    location /_next/static/ {
        proxy_pass http://kjar_web;
        include /etc/nginx/conf.d/proxy_params.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
